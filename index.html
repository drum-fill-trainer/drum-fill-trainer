<body>
  <script>
    (() => {
      if (window.__drumTrainerAudioUnlockInstalled) {
        return;
      }
      window.__drumTrainerAudioUnlockInstalled = true;

      const unlockEvents = ['touchend', 'click', 'pointerup'];

      const resumeContext = (context) => {
        if (!context || typeof context.resume !== 'function') {
          return;
        }
        try {
          if (context.state === 'suspended') {
            const resumePromise = context.resume();
            if (resumePromise && typeof resumePromise.catch === 'function') {
              resumePromise.catch(() => {});
            }
          }
        } catch (_) {}
      };

      const primeAudioByGesture = () => {
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (typeof AudioContextCtor !== 'function') {
          return;
        }

        try {
          const context = new AudioContextCtor();
          resumeContext(context);
          if (typeof context.close === 'function') {
            const closePromise = context.close();
            if (closePromise && typeof closePromise.catch === 'function') {
              closePromise.catch(() => {});
            }
          }
        } catch (_) {}
      };

      const resumeMiniaudioContexts = () => {
        const miniaudio = window.miniaudio;
        if (!miniaudio || !Array.isArray(miniaudio.devices)) {
          return;
        }

        for (const device of miniaudio.devices) {
          resumeContext(device && device.webaudio);
        }
      };

      const unlockAudio = () => {
        primeAudioByGesture();
        resumeMiniaudioContexts();
      };

      window.__drumTrainerUnlockAudio = unlockAudio;

      for (const eventName of unlockEvents) {
        document.addEventListener(eventName, unlockAudio, {
          capture: true,
          passive: true,
        });
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" defer></script>
</body>
